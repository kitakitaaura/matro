name: Release Binaries & Wasm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-native:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build native matro CLI
        run: cargo build -p matro_cli --release --target ${{ matrix.target }}
      - name: Package release archive
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/matro${{ matrix.ext }} dist/matro-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: matro-${{ matrix.target }}
          path: dist/*

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - name: Install Binaryen (wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
      - name: Build SIMD browser Wasm & WASI CLI
        run: |
          mkdir -p dist
          RUSTFLAGS="-C target-feature=+simd128" cargo build -p matro_wasm --target wasm32-unknown-unknown --profile wasm-release
          wasm-opt -Oz --enable-simd --enable-bulk-memory --enable-sign-ext --enable-mutable-globals --enable-nontrapping-float-to-int \
            target/wasm32-unknown-unknown/wasm-release/matro_wasm.wasm -o dist/matro_wasm.wasm
          cp dist/matro_wasm.wasm packages/matro-wasm/matro_wasm.wasm
          tar -czf dist/matro-wasm-sdk.tar.gz -C packages matro-wasm
          cargo build -p matro_cli --target wasm32-wasip1 --profile wasm-release
          cp target/wasm32-wasip1/wasm-release/matro.wasm dist/matro-wasip1.wasm
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: matro-wasm-artifacts
          path: dist/*

  publish-release:
    needs: [build-native, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
